# Builds statically linked vorpalite binaries for Linux (x64), macOS (ARM64), and Windows (x64).
#
# Source is fetched from BrunoLevy/geogram (use the 'ref' input to select a tag, branch, or commit).
# A minimal option set (cmake/options/CMakeOptions.txt.Minimal) is used, which builds only the
# vorpalite library and executable, skipping graphics, tests, and other CLI tools.
#
# Using GEOGRAM_WITH_TBB so that the resulting binaries are fully self-contained with no external
# DLL/shared library dependencies.
# CMAKE_POLICY_VERSION_MINIMUM=3.5 is passed to accommodate oneTBB's legacy cmake_minimum_required
# with CMake 4.x.
#
# Platform-specific linking:
#   - Linux (ubuntu-latest, Linux64-gcc): fully static (-static -static-libstdc++ -static-libgcc)
#   - macOS (macos-14, Darwin-clang): static libs, dynamic system framework loading
#   - Windows (windows-latest, Win-vs-generic): static runtime (/MT)
#
# Each build is packaged as a zip with a SHA-256 checksum and published as a GitHub release
# tagged geogram-v<version>, where the version is read from CMakeLists.txt.
#
# Co-authored-by: GitHub Copilot, opencode/big-pickle

name: Build vorpalite release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/branch/commit to build from BrunoLevy/geogram"
        required: false
        default: "main"

jobs:
  build:
    name: ${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_id: win64
            exe_name: vorpalite.exe
          - os: ubuntu-latest
            platform_id: lin64
            configure_platform: Linux64-gcc
            exe_name: vorpalite
          - os: macos-14
            platform_id: mac64-arm64
            configure_platform: Darwin-clang
            exe_name: vorpalite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: BrunoLevy/geogram
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Verify ref is tag
        shell: bash
        run: |
          if ! git show-ref -q --verify "refs/tags/${{ inputs.ref }}" || [[ "${{ inputs.ref }}" != v* ]]; then
            echo "ERROR: The ref input (${{ inputs.ref }}) does not look like a version tag (e.g., v1.2.3) or does not exist in BrunoLevy/geogram."
            exit 1
          fi

      - name: Select minimal build options
        run: cp cmake/options/CMakeOptions.txt.Minimal CMakeOptions.txt

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -S . -B build/Windows -DVORPALINE_PLATFORM:STRING=Win-vs-generic -DGEOGRAM_WITH_TBB=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build/${{ matrix.configure_platform }}-Release -DCMAKE_BUILD_TYPE:STRING=Release -DVORPALINE_PLATFORM:STRING=${{ matrix.configure_platform }} -DGEOGRAM_WITH_TBB=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build vorpalite (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake --build build/Windows --target vorpalite --config Release

      - name: Build vorpalite (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build/${{ matrix.configure_platform }}-Release --target vorpalite --config Release

      - name: Locate built executable
        shell: bash
        run: |
          exe=$(find build -type f -name "${{ matrix.exe_name }}" | head -n 1)
          if [ -z "$exe" ]; then
            echo "Could not find ${{ matrix.exe_name }} under build/"
            exit 1
          fi
          mkdir -p dist
          cp "$exe" dist/
          cp LICENSE dist/

      - name: Smoke test executable
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.exe_name }}" || true
          "./dist/${{ matrix.exe_name }}" --version

      - name: Package and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "vorpalite-${{ matrix.platform_id }}.zip"
          Compress-Archive -Path dist\* -DestinationPath "dist\$zip"
          $hash = (Get-FileHash "dist\$zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Tee-Object "dist\$zip.sha256"

      # macOS has no sha256sum (uses shasum -a 256 instead)
      - name: Package and checksum (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          zip -r "vorpalite-${{ matrix.platform_id }}.zip" .
          (sha256sum "vorpalite-${{ matrix.platform_id }}.zip" 2>/dev/null || shasum -a 256 "vorpalite-${{ matrix.platform_id }}.zip") | tee "vorpalite-${{ matrix.platform_id }}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vorpalite-${{ matrix.platform_id }}
          path: |
            dist/vorpalite-${{ matrix.platform_id }}.zip
            dist/vorpalite-${{ matrix.platform_id }}.zip.sha256

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: BrunoLevy/geogram
          ref: ${{ inputs.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: Releases
          merge-multiple: true

      - name: Print checksums
        id: checksums
        shell: bash
        run: cat Releases/*.sha256

      - name: Deploy release files
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.ref }}
          draft: false
          files: Releases/*.zip
          fail_on_unmatched_files: true
